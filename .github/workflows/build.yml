name: Build Binaries

on:
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: "386"
            goarm: ""
            ext: .exe
          - goos: darwin
            goarch: amd64
            goarm: ""
            ext: ""
          - goos: darwin
            goarch: arm64
            goarm: ""
            ext: ""
          - goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
          - goos: linux
            goarch: "386"
            goarm: ""
            ext: ""
          - goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
          - goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - goos: linux
            goarch: riscv64
            goarm: ""
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ARM_SUFFIX=""
          if [ -n "${GOARM}" ]; then
            ARM_SUFFIX="v${GOARM}"
          fi
          BINARY_NAME="gipool_go-${GOOS}-${GOARCH}${ARM_SUFFIX}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "dist/${BINARY_NAME}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm != '' && format('-v{0}', matrix.goarm) || '' }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
      
      - name: Collect release binaries
        run: |
          mkdir -p release-assets
          find dist -type f -exec cp {} release-assets/ \;

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          overwrite_files: true
